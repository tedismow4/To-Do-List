<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mainPage.css">
</head>
<body>
  <main class="card">
    <h1>To-do list</h1>
    <p class="count" id="count"></p>

    <div class="add">
      <input type="text" id="newTask" placeholder="What needs doing?" aria-label="New task" autocomplete="off">
      <input type="date" id="newDate" aria-label="Due date">
      <button id="addBtn">Add task</button>
    </div>

    <ul class="legend" aria-label="Color key">
      <li><i class="dot overdue"></i>Overdue</li>
      <li><i class="dot urgent"></i>1-2 days</li>
      <li><i class="dot soon"></i>3-7 days</li>
      <li><i class="dot later"></i>8+ days</li>
    </ul>

    <ul id="list"></ul>
    <button class="clear" id="clearBtn">Clear completed</button>
  </main>

  <script src="mainPage.js"></script>
</body>
</html>
